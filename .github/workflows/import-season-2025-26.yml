name: Importa stagione 2025-26 (una tantum)

on:
  workflow_dispatch: {} # si lancia SOLO a mano dal sito GitHub, non gira mai da solo

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa dipendenze
        working-directory: ./scripts
        run: npm install

      - name: Importa dati stagione 2025/26
        working-directory: ./scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node import-2025-26.js
